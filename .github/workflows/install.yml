name: build-and-release

on:
  push:
    tags: ["v*"]
    branches: ["main"]
    paths:
      - ".github/workflows/install.yml"
      - "tools/**"
      - "assets/**"
      - "agent/**"
      - "web/**"
      - "tests/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MAAFW_VERSION: "v5.14.3"
  MXU_VERSION: "v2.7.1"
  PYTHON_VERSION: "3.12.10"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: win
            runner: windows-latest
          - os: linux
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]] || exit 1
            version="$REF_NAME"
          else
            version="v0.1.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Download MaaFramework
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MaaFramework
          tag: ${{ env.MAAFW_VERSION }}
          fileName: "MAA-${{ matrix.os }}-x86_64-${{ env.MAAFW_VERSION }}.zip"
          out-file-path: deps
          extract: true

      - name: Download MXU
        uses: robinraju/release-downloader@v1
        with:
          repository: MistEO/MXU
          tag: ${{ env.MXU_VERSION }}
          fileName: "MXU-${{ matrix.os }}-x86_64-${{ env.MXU_VERSION }}.${{ matrix.os == 'win' && 'zip' || 'tar.gz' }}"
          out-file-path: MXU
          extract: true

      - name: Remove downloaded archives
        run: |
          find MXU -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) -delete

      - uses: astral-sh/setup-uv@v6

      - name: Assemble portable runtime and resources
        run: |
          uv python install "$PYTHON_VERSION" --install-dir .python-build --no-bin
          python tools/prepare_release.py "${{ matrix.os }}"
          python -m pip install -r tools/requirements.txt "maafw==${MAAFW_VERSION#v}"
          python -m unittest discover -s tests -v
          python tools/install.py "$VERSION" "${{ matrix.os }}" x86_64
          if [[ "${{ matrix.os }}" == win ]]; then
            runtime=install/python/python.exe
          else
            runtime=install/python/bin/python3
          fi
          uv pip install --python "$runtime" --system --break-system-packages "maafw==${MAAFW_VERSION#v}"
          (cd install && "./${runtime#install/}" -c "from maa.agent.agent_server import AgentServer; import sqlite3; from agent.rune.config_store import _read_seed, SEED_DB_PATH; assert _read_seed(SEED_DB_PATH)")

      - name: Create portable archive
        run: |
          mkdir -p dist
          if [[ "${{ matrix.os }}" == win ]]; then
            python -c "import shutil; shutil.make_archive('dist/SwEasy-win-x64-$VERSION', 'zip', 'install')"
          else
            tar -czf "dist/SwEasy-linux-amd64-$VERSION.tar.gz" -C install .
          fi

      - uses: actions/setup-go@v5
        if: matrix.os == 'linux'
        with:
          go-version: "1.25.x"

      - name: Create deb, rpm and pacman packages
        if: matrix.os == 'linux'
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.4
          chmod +x tools/linux/sweasy
          export PACKAGE_VERSION="${VERSION#v}"
          nfpm package --config tools/nfpm.yaml --packager deb --target "dist/SwEasy-linux-amd64-$VERSION.deb"
          nfpm package --config tools/nfpm.yaml --packager rpm --target "dist/SwEasy-linux-amd64-$VERSION.rpm"
          nfpm package --config tools/nfpm.yaml --packager archlinux --target "dist/SwEasy-linux-amd64-$VERSION.pkg.tar.zst"
          for package in dist/*.deb dist/*.rpm dist/*.pkg.tar.zst; do test -s "$package"; done
          ldd install/mxu

      - name: Checksums
        run: |
          cd dist
          sha256sum * > "SHA256SUMS-${{ matrix.os }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: SwEasy-${{ matrix.os }}-x64
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
